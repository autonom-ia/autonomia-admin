name: Admin API CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autonomia_admin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autonomia_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Run migrations in disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/autonomia_admin_test
          DATABASE_SSL_MODE: disable
        run: pnpm migrate
      - name: Run real database and JWKS tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/autonomia_admin_test
          DATABASE_SSL_MODE: disable
        run: pnpm test
      - run: pnpm build
