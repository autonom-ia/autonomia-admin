name: Admin API CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: node scripts/check-production-deploy-gate.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Start runner-local PostgreSQL 16
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          server_version_num="$(sudo -u postgres psql -Atqc 'SHOW server_version_num')"
          case "$server_version_num" in
            16????) ;;
            *) echo "Expected PostgreSQL 16, got server_version_num=$server_version_num" >&2; exit 1 ;;
          esac
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres PASSWORD 'postgres'"
      - name: Create attested disposable Admin database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          instance_id="$(node -e "console.log(crypto.randomUUID())")"
          createdb -h 127.0.0.1 -p 5432 -U postgres autonomia_admin_local
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -c "ALTER DATABASE autonomia_admin_local SET app.environment = 'local'" \
            -c "ALTER DATABASE autonomia_admin_local SET app.local_instance_id = '${instance_id}'"
          {
            echo "APP_ENV=local"
            echo "ADMIN_LOCAL_MIGRATION_CONFIRM=autonomia_admin_local"
            echo "ADMIN_LOCAL_DATABASE_INSTANCE_ID=${instance_id}"
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/autonomia_admin_local"
            echo "DATABASE_SSL_MODE=disable"
          } >> "$GITHUB_ENV"
      - name: Run migrations in disposable PostgreSQL
        run: pnpm migrate:local
      - name: Run real database and JWKS tests
        run: pnpm test
      - run: pnpm build
