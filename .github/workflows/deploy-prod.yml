name: Deploy Admin API prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: autonomia-admin-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autonomia_admin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autonomia_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Run migrations in disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/autonomia_admin_test
          DATABASE_SSL_MODE: disable
        run: pnpm migrate
      - name: Run real database and JWKS tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/autonomia_admin_test
          DATABASE_SSL_MODE: disable
        run: pnpm test
      - run: pnpm build

      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing GitHub environment variable AWS_REGION}"
          : "${AWS_ROLE_TO_ASSUME:?Missing GitHub environment variable AWS_ROLE_TO_ASSUME}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda API
        run: pnpm exec serverless deploy --stage prod --region "${{ vars.AWS_REGION }}"

      - name: Run database migrations
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name autonomia-admin-prod-migrate \
            --payload '{}' \
            /tmp/autonomia-admin-migrate-response.json
          cat /tmp/autonomia-admin-migrate-response.json
